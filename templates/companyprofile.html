<!DOCTYPE html>
<html>
<head>
<title>Company Profile</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="dash-wrap">
  <nav class="sidebar">
      <div class="sidebar-brand">
          <i class="bi bi-building"></i> Company Panel
      </div>
      <div class="sidebar-section">MAIN</div>
      <a href="/company" class="sidebar-link">
          <i class="bi bi-speedometer2"></i> Dashboard
      </a>
      <a href="/company/profile" class="sidebar-link active">
          <i class="bi bi-gear"></i> Profile
      </a>
      <a href="/company/drives" class="sidebar-link">
          <i class="bi bi-briefcase"></i> Placement Drives
      </a>
      <a href="/company/applications" class="sidebar-link">
          <i class="bi bi-file-earmark-text"></i> Applications
      </a>
      <div class="sidebar-footer">
          <a href="/logout" class="sidebar-link sidebar-logout">
              <i class="bi bi-box-arrow-right"></i> Logout
          </a>
      </div>
  </nav>

  <div class="dash-main">
    <div class="page-header">
      <h4>Company Profile</h4>
    </div>

    <div class="card shadow-sm mt-3">
      <div class="card-body">
        <form method="POST" action="/company/profile/update">
          <div class="form-group mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-control" value="{{company.name}}" required minlength="2" maxlength="100" pattern="[A-Za-z0-9\s&.,'-]+" title="Name should be 2–100 characters and contain only letters, numbers, spaces or & . , ' -">
          </div>
          <div class="form-group mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" value="{{company.email}}" disabled>
          </div>
          <div class="form-group mb-3">
            <label class="form-label">Industry</label>
            <input type="text" name="category" class="form-control" value="{{company.category}}" required minlength="2" maxlength="60" pattern="[A-Za-z\s]+" title="Industry should contain only letters and spaces">
          </div>
          <div class="form-group mb-3">
            <label class="form-label">Scale</label>
            <input type="text" name="scale" class="form-control" value="{{company.scale}}" required pattern="[A-Za-z\s]+" title="Enter the Scale">
          </div>
          <div class="form-group mb-3">
            <label class="form-label">Website</label>
            <input type="url" name="website" class="form-control" value="{{company.website}}" placeholder="https://example.com" required>
          </div>
          <div class="form-group mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" required minlength="20" maxlength="500" title="Description must be between 20 and 500 characters">{{company.description}}</textarea>
          </div>
          <button class="btn btn-primary">Update Profile</button>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
