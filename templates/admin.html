<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Placement Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        :root { --sidebar-bg: #0f172a; --accent: #3b82f6; }
        body { background-color: #f8f9fc; min-height: 100vh; display: flex; }
        .sidebar { min-width: 260px; background: var(--sidebar-bg); color: white; }
        .sidebar a { color: rgba(255,255,255,0.6); text-decoration: none; padding: 12px 20px; display: block; border-radius: 8px; margin: 4px 15px; }
        .sidebar a:hover { background: rgba(255,255,255,0.1); color: white; }
        .sidebar a.active { background: var(--accent); color: white; font-weight: bold; }
        .main-content { flex-grow: 1; display: flex; flex-direction: column; }
    </style>
</head>
<body>
    <div class="sidebar d-none d-md-block shadow">
        <div class="p-4 text-center border-bottom border-secondary mb-3">
            <h5 class="fw-bold mb-0 text-white"><i class="bi bi-shield-check me-2"></i>Admin Dashboard</h5>
        </div>
        <nav>
            <a href="admin.html" class="active"><i class="bi bi-grid-1x2 me-2"></i> Dashboard</a>
            <a href="approvals.html"><i class="bi bi-building-check me-2"></i> Approvals</a>
            <a href="students.html"><i class="bi bi-people me-2"></i> Student Data</a>
            <a href="drives.html"><i class="bi bi-calendar3 me-2"></i> Active Drives</a>
            <hr class="mx-3 my-4 opacity-25">
            <a href="login.html" class="text-danger"><i class="bi bi-power me-2"></i> Log Out</a>
        </nav>
    </div>

    <div class="main-content">
        <nav class="navbar navbar-light bg-white px-4 py-2 border-bottom shadow-sm">
            <span class="navbar-text fw-bold text-dark">Dashboard Overview</span>
        </nav>
        <div class="p-4">
            <div class="row g-4 mb-4">
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm p-3 border-start border-primary border-4">
                        <small class="text-muted fw-bold">PLACED STUDENTS</small>
                        <div class="h3 fw-bold mb-0">1,240</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm p-3 border-start border-warning border-4">
                        <small class="text-muted fw-bold">PENDING APPROVALS</small>
                        <div class="h3 fw-bold mb-0">14</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm p-3 border-start border-success border-4">
                        <small class="text-muted fw-bold">HIGHEST CTC</small>
                        <div class="h3 fw-bold mb-0">48.5 LPA</div>
                    </div>
                </div>
            </div>
            <div class="card border-0 shadow-sm p-5 text-center">
                <i class="bi bi-graph-up-arrow fs-1 text-primary mb-3"></i>
                <h5>Season Progress</h5>
                <p class="text-muted">Currently at 80% of placement targets for the 2026 Batch.</p>
            </div>
        </div>
    </div>
</body>
</html>
