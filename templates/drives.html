<!DOCTYPE html>
<html>
<head>
<title>Drives</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container-fluid">
<div class="row">

<div class="col-md-3 col-lg-2 bg-black text-white min-vh-100 p-3">

<h5 class="mb-4">Manager Panel</h5>

<ul class="nav flex-column">
<li class="nav-item mb-2"><a href="/manager" class="nav-link text-white">Dashboard</a></li>
<li class="nav-item mb-2"><a href="/manager/companies" class="nav-link text-white">Companies</a></li>
<li class="nav-item mb-2"><a href="/manager/students" class="nav-link text-white">Students</a></li>
<li class="nav-item mb-2"><a href="/manager/drives" class="nav-link text-white">Drives</a></li>
<li class="nav-item"><a href="/logout" class="nav-link text-danger">Logout</a> </li>
</ul>

</div>

<div class="col-md-9 col-lg-10 p-4">

<h4>Placement Drives</h4>

<table class="table table-bordered">

<tr>
<th>Company</th>
<th>Title</th>
<th>Deadline</th>
<th>Details</th>
</tr>

{% for drive in drives %}

<tr>

<td>{{drive.company.name}}</td>
<td>{{drive.title}}</td>
<td>{{drive.applicationDeadline}}</td>

<td>
<a href="/manager/company/{{drive.company.id}}" class="btn btn-primary btn-sm">
Company Details
</a>
</td>

</tr>

{% endfor %}

</table>

</div>
</div>
</div>

</body>
</html>
