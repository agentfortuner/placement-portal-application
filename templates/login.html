<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Placement Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background: radial-gradient(circle at top right, #1e293b, #0f172a); 
            height: 100vh; 
            margin: 0;
            display: flex;
            align-items: center;
        }
        .login-card { 
            border-radius: 24px; 
            border: none; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .form-control {
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #e2e8f0;
        }
        .btn-primary {
            background-color: #3b82f6;
            border-radius: 12px;
            font-weight: bold;
            border: none;
            transition: transform 0.2s;
        }
        .btn-primary:hover {
            background-color: #2563eb;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card login-card p-4">
                    <div class="card-body">
                        <div class="text-center mb-4">
                             <h4 class="fw-bold text-dark">Welcome Back</h4>
                             <p class="text-muted small">Sign in to your dashboard</p>
                        </div>
                        <form action="/login" method="POST">
                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com">
                                <label for="email">Email address</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="password" name="password" placeholder="Password">
                                <label for="password">Password</label>
                            </div>
                            <div class="d-flex justify-content-between mb-3 px-1">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="remember">
                                    <label class="small text-muted" for="remember">Keep me logged in</label>
                                </div>
                                <a href="#" class="small text-decoration-none text-primary fw-bold">Forgot?</a>
                            </div>
                            <button class="btn btn-primary w-100 py-3 shadow-sm" type="submit">Login</button>
                        </form>
                        
                        <div class="text-center mt-4">
                            <p class="text-muted small">Don't have an account? <a href="register.html" class="text-decoration-none fw-bold">Sign Up</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
