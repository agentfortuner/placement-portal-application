<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — PlacePortal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon-wrap"><i class="bi bi-person-fill-lock"></i></div>
      <h2>Welcome back</h2>
      <p>Sign in to your PlacePortal account</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}"><i class="bi bi-exclamation-circle"></i>{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {{ a }}

    <form action="/login" method="POST">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
      </div>
      <div class="form-check mb-4 mt-1">
        <input type="checkbox" class="form-check-input" id="remember" name="remember">
        <label class="form-check-label" for="remember">Remember me for 30 days</label>
      </div>
      <button type="submit" class="btn btn-primary w-100 btn-lg">
        <i class="bi bi-box-arrow-in-right"></i> Sign In
      </button>
    </form>

    <div class="auth-divider">or</div>
    <p class="text-center" style="font-size:0.85rem">
      Don't have an account? <a href="/register" style="font-weight:600">Create one free</a>
    </p>
  </div>
</div>
</body>
</html>
