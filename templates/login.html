<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Placement Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card login-card p-4">
                    <div class="card-body">
                        {{ a }}
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{category}}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% endwith %}
                        <div class="text-center mb-4">
                             <h4 class="fw-bold text-dark">Welcome Back</h4>
                             <p class="text-muted small">Sign in to your dashboard</p>
                        </div>
                        <form action="/login" method="POST">
                            <div class="mb-3">
                                <input type="text"
                                name="username"
                                class="form-control"
                                placeholder="Username"
                                required>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="password" name="password" placeholder="Password">
                                <label for="password">Password</label>
                            </div>
                            <div class="d-flex justify-content-between mb-3 px-1">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="remember">
                                    <label class="small text-muted" for="remember">Keep me logged in</label>
                                </div>
                                <a href="#" class="small text-decoration-none text-primary fw-bold">Forgot?</a>
                            </div>
                            <button class="btn btn-primary w-100 py-3 shadow-sm" type="submit">Login</button>
                        </form>
                        
                        <div class="text-center mt-4">
                            <p class="text-muted small">Don't have an account? <a href="/register" class="text-decoration-none fw-bold">Sign Up</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
