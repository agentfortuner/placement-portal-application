<!DOCTYPE html>
<html>
<head>
<title>Company Drives</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

<h3>Your Drives</h3>

<table class="table table-bordered">

<tr>
<th>Title</th>
<th>Vacancies</th>
<th>Deadline</th>
<th>Status</th>
</tr>

{% for drive in drives %}

<tr>

<td>{{drive.title}}</td>

<td>{{drive.vacancy}}</td>

<td>{{drive.applicationDeadline}}</td>

<td>{{drive.hiringStatus}}</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
