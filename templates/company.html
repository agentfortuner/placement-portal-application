<!DOCTYPE html>
<html>
<head>
<title>Company Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/static/style.css">
</head>

<body>
<div class="dash-wrap">
  <nav class="sidebar">
      <div class="sidebar-brand">
          <i class="bi bi-building"></i> Company Panel
      </div>
      <div class="sidebar-section">MAIN</div>
      
      <a href="/company" class="sidebar-link active">
          <i class="bi bi-speedometer2"></i> Dashboard
      </a>
      <a href="/company/profile" class="sidebar-link">
          <i class="bi bi-gear"></i> Profile
      </a>
      <a href="/company/drives" class="sidebar-link">
          <i class="bi bi-briefcase"></i> Placement Drives
      </a>
      <a href="/company/applications" class="sidebar-link">
          <i class="bi bi-file-earmark-text"></i> Applications
      </a>

      <div class="sidebar-footer">
          <a href="/logout" class="sidebar-link sidebar-logout">
              <i class="bi bi-box-arrow-right"></i> Logout
          </a>
      </div>
  </nav>

  <div class="dash-main">
    <div class="page-header">
      <h4>Company Dashboard</h4>
      <p class="text-muted">Welcome, {{ current_user.name }}</p>
    </div>

    <div class="stats-grid mt-4">
      <div class="stat-card stat-teal">
        <h6>Drives Created</h6>
        <h3>{{drives}}</h3>
      </div>
      <div class="stat-card stat-indigo">
        <h6>Applications Received</h6>
        <h3>{{applications}}</h3>
      </div>
      <div class="stat-card stat-amber">
        <h6>Shortlisted Candidates</h6>
        <h3>{{shortlisted}}</h3>
      </div>
    </div>

    <div class="card mt-4">
      <div class="card-header">
        <h5 class="mb-0">Quick Actions</h5>
      </div>
      <div class="card-body gap-2 d-flex">
        <a href="/company/drive/create" class="btn btn-emerald">
          <i class="bi bi-plus-circle"></i> Create New Drive
        </a>
        <a href="/company/applications" class="btn btn-ghost">
          <i class="bi bi-file-earmark-text"></i> View Applications
        </a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
