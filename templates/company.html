<!DOCTYPE html>
<html>
<head>
<title>Company Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container-fluid">
<div class="row">
<!-- Sidebar -->
<div class="col-md-3 col-lg-2 bg-dark text-white min-vh-100 p-3 d-none d-md-block">

<h5 class="mb-4">Company Panel</h5>

<ul class="nav flex-column">

<li class="nav-item mb-2">
<a href="/company" class="nav-link text-white">Dashboard</a>
</li>

<li class="nav-item mb-2">
<a href="/company/profile" class="nav-link text-white">Profile</a>
</li>

<li class="nav-item mb-2">
<a href="/company/drives" class="nav-link text-white">Placement Drives</a>
</li>

<li class="nav-item mb-2">
<a href="/company/applications" class="nav-link text-white">Applications</a>
</li>

<li class="nav-item">
<a href="/logout" class="nav-link text-danger">Logout</a>
</li>

</ul>

</div>

<div class="col-md-9 col-lg-10 p-4">

<h4>Company Dashboard</h4>

<div class="row mt-4">

<div class="col-md-4">
<div class="card text-center shadow-sm">
<div class="card-body">
<h6>Drives Created</h6>
<h3>{{drives}}</h3>
</div>
</div>
</div>

<div class="col-md-4">
<div class="card text-center shadow-sm">
<div class="card-body">
<h6>Applications Received</h6>
<h3>{{applications}}</h3>
</div>
</div>
</div>

<div class="col-md-4">
<div class="card text-center shadow-sm">
<div class="card-body">
<h6>Shortlisted Candidates</h6>
<h3>{{shortlisted}}</h3>
</div>
</div>
</div>

</div>

</div>
</div>
</div>

</body>
</html>
