<!DOCTYPE html>
<html>
<head>
<title>Company Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container-fluid">
<div class="row">

<!-- Sidebar -->
<div class="col-md-3 col-lg-2 bg-dark text-white min-vh-100 p-3">

<h5 class="mb-4">Company Panel</h5>

<ul class="nav flex-column">

<li class="nav-item mb-2">
<a href="/company" class="nav-link text-white">Dashboard</a>
</li>

<li class="nav-item mb-2">
<a href="/company/profile" class="nav-link text-white">Profile</a>
</li>

<li class="nav-item mb-2">
<a href="/company/drives" class="nav-link text-white">Drives</a>
</li>

<li class="nav-item mb-2">
<a href="/company/create-drive" class="nav-link text-white">Create Drive</a>
</li>

<li class="nav-item mb-2">
<a href="/company/applications" class="nav-link text-white">Applications</a>
</li>

<hr class="bg-light">

<li class="nav-item">
<a href="/login" class="nav-link text-danger">Logout</a>
</li>

</ul>

</div>

<!-- Main Content -->
<div class="col-md-9 col-lg-10 p-4">

<h4>Company Dashboard</h4>

<div class="row">

<div class="col-md-4">
<div class="card text-center shadow-sm">
<div class="card-body">
<h6>Total Drives</h6>
<h3>{{drives}}</h3>
</div>
</div>
</div>

<div class="col-md-4">
<div class="card text-center shadow-sm">
<div class="card-body">
<h6>Total Applications</h6>
<h3>{{applications}}</h3>
</div>
</div>
</div>

</div>

</div>
</div>
</div>

</body>
</html>
