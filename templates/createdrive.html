<!DOCTYPE html>
<html>
<head>
<title>Create Drive</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5" style="max-width:600px">

<h3>Create Placement Drive</h3>

<form method="POST">

<input name="title" class="form-control mb-3" placeholder="Job Title">

<textarea name="description" class="form-control mb-3" placeholder="Description"></textarea>

<textarea name="eligibilityCriteria" class="form-control mb-3" placeholder="Eligibility"></textarea>

<input name="vacancy" type="number" class="form-control mb-3" placeholder="Vacancies">

<input name="location" class="form-control mb-3" placeholder="Location">

<input type="date" name="applicationDeadline" class="form-control mb-3">

<button class="btn btn-primary w-100">
Create Drive
</button>

</form>

</div>

</body>
</html>
