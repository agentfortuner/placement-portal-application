<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Placement Portal{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Placement Portal</a>

        <div>
            <a class="btn btn-outline-light btn-sm me-2" href="/login">Login</a>
            <a class="btn btn-light btn-sm" href="/register">Register</a>
        </div>
    </div>
</nav>

<div class="container text-center mt-5">

    <h1 class="fw-bold">Welcome to the Placement Portal</h1>

    <p class="text-muted mt-3">
        A centralized platform for students, companies, and administrators  
        to manage campus recruitment efficiently.
    </p>

    <div class="mt-4">
        <a href="/register" class="btn btn-primary btn-lg me-3">
            Get Started
        </a>

        <a href="/login" class="btn btn-outline-dark btn-lg">
            Login
        </a>
    </div>

</body>
</html>
