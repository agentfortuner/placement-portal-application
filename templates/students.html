<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Data | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: sans-serif; }
        .navbar { background: #0f172a; }
        .container { margin-top: 30px; }
        .card { border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="admin.html">Placement Admin</a>
            <div class="d-flex">
                <a href="admin.html" class="btn btn-outline-light btn-sm me-2">Back to Dashboard</a>
                <a href="login.html" class="btn btn-danger btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Student Database</h2>
            <button class="btn btn-primary">Download CSV</button>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Name</th>
                            <th>Roll Number</th>
                            <th>CGPA</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="ps-4">Rahul Sharma</td>
                            <td>CS2026-042</td>
                            <td><strong>9.12</strong></td>
                            <td><span class="badge bg-success">Placed: Amazon</span></td>
                        </tr>
                        <tr>
                            <td class="ps-4">Sneha Kapoor</td>
                            <td>IT2026-105</td>
                            <td><strong>8.75</strong></td>
                            <td><span class="badge bg-warning text-dark">Unplaced</span></td>
                        </tr>
                        <tr>
                            <td class="ps-4">Amit Verma</td>
                            <td>ME2026-012</td>
                            <td><strong>7.50</strong></td>
                            <td><span class="badge bg-success">Placed: Tata Motors</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
