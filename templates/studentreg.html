<!DOCTYPE html>
<html>
<head>
<title>Student Registration | Placement Portal</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container d-flex align-items-center justify-content-center" style="min-height:100vh;">

<div class="card shadow p-4" style="width:450px;">

<h3 class="text-center mb-3">Student Registration</h3>
<p class="text-center text-muted mb-4">Create your placement account</p>

{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}
<div class="alert alert-{{category}}">{{ message }}</div>
{% endfor %}
{% endwith %}

<form method="POST" enctype="multipart/form-data">

<!-- USER TABLE -->

<div class="mb-3">
<label class="form-label">Full Name</label>
<input type="text" name="name" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Username</label>
<input type="text" name="username" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" name="email" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Password</label>
<input type="password" name="password" class="form-control" required>
</div>

<hr>

<!-- STUDENT TABLE -->

<div class="mb-3">
<label class="form-label">Roll Number</label>
<input type="text" name="rollNumber" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Department</label>

<select name="department" class="form-select">

<option value="CSE">Computer Science</option>
<option value="ECE">Electronics & Communication</option>
<option value="ME">Mechanical</option>
<option value="CE">Civil</option>
<option value="DS">Data Science</option>

</select>

</div>

<div class="mb-3">
<label class="form-label">Year of Study</label>

<select name="yearOfStudy" class="form-select">

<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>

</select>

</div>

<div class="mb-3">
<label class="form-label">GPA</label>
<input type="number" step="0.01" name="gpa" class="form-control" placeholder="Enter your GPA" required>
</div>

<div class="mb-3">
<label class="form-label">Upload Resume</label>
<input type="file" name="resume" class="form-control" accept=".pdf,.doc,.docx">
</div>

<button type="submit" class="btn btn-primary w-100">
Register
</button>

</form>

<div class="text-center mt-3">
<small>Already registered? <a href="/login">Login</a></small>
</div>

</div>
</div>

</body>
</html>
