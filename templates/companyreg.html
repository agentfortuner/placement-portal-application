<!DOCTYPE html>
<html>
<head>
    <title>Company Registration | Placement Portal</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5" style="max-width:700px;">

    <div class="card shadow-sm">
        <div class="card-body p-4">

            <h4 class="mb-4 text-center">Company Registration</h4>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Company Name</label>
                        <input type="text" class="form-control" name="name" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" name="username" required>
                    </div>

                </div>

                <div class="mb-3">
                    <label class="form-label">Official Email</label>
                    <input type="email" class="form-control" name="email" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" required>
                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Contact Person Name</label>
                        <input type="text" class="form-control" name="contactName">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Contact Email</label>
                        <input type="email" class="form-control" name="contactEmail" required>
                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Company Category</label>
                        <select class="form-select" name="category" required>
                            <option value="">Select</option>
                            <option value="Gold">Gold</option>
                            <option value="Silver">Silver</option>
                            <option value="Base">Base</option>
                            <option value="Startup">Startup</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Company Scale</label>
                        <select class="form-select" name="scale" required>
                            <option value="">Select</option>
                            <option value="Small">Small</option>
                            <option value="Medium">Medium</option>
                            <option value="Large">Large</option>
                            <option value="MNC">MNC</option>
                        </select>
                    </div>

                </div>

                <div class="mb-3">
                    <label class="form-label">Company Description</label>
                    <textarea class="form-control" name="description" rows="3"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Placement History</label>
                    <textarea class="form-control" name="placementHistory" rows="2"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Website</label>
                    <input type="url" class="form-control" name="website">
                </div>

                <div class="mb-3">
                    <label class="form-label">Address</label>
                    <input type="text" class="form-control" name="address">
                </div>

                <div class="mb-3">
                    <label class="form-label">Locations</label>
                    <input type="text" class="form-control" name="locations">
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Register Company
                </button>

            </form>

            <div class="text-center mt-3">
                <small>Already registered? <a href="/login">Login</a></small>
            </div>
             
             <div class="text-center mt-3">
                <a href="/register">Back</a>
            </div>

        </div>
    </div>

</div>

</body>
</html>
