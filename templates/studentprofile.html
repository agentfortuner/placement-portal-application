<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile | Placement Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="dash-wrap">
        <nav class="sidebar">
            <div class="sidebar-brand">Placement Portal</div>
            <div class="sidebar-section">Student Panel</div>
            <a href="/student" class="sidebar-link">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
            <a href="/student/profile" class="sidebar-link active">
                <i class="bi bi-person-circle"></i> Profile
            </a>
            <a href="/student/drives" class="sidebar-link">
                <i class="bi bi-briefcase"></i> Apply Drives
            </a>
            <a href="/student/applications" class="sidebar-link">
                <i class="bi bi-file-earmark-text"></i> My Applications
            </a>
            <div class="sidebar-footer">
                <a href="/logout" class="sidebar-link sidebar-logout">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </a>
            </div>
        </nav>

        <div class="dash-main">
            <div class="page-header">
                <h2>My Profile</h2>
            </div>

            <div class="card mt-3">
                <div class="card-body">
                    <form method="POST" enctype="multipart/form-data">
                        <div class="form-group mb-3">
                            <label class="form-label">Roll Number</label>
                            <input 
                                name="rollNumber" 
                                class="form-control"
                                value="{{student.rollNumber}}"
                                required
                                pattern="[A-Za-z0-9\-]+"
                                title="Roll number should contain letters, numbers or hyphens only">
                        </div>

                        <div class="form-group mb-3">
                            <label class="form-label">Department</label>
                            <input 
                                name="department" 
                                class="form-control"
                                value="{{student.department}}"
                                required
                                pattern="[A-Za-z\s]{2,50}"
                                title="Department should contain only letters and spaces">
                        </div>

                        <div class="form-group mb-3">
                            <label class="form-label">GPA</label>
                            <input 
                                type="number"
                                name="gpa" 
                                class="form-control"
                                value="{{student.gpa}}"
                                required
                                min="0"
                                max="10"
                                step="0.01"
                                title="GPA must be between 0 and 10">
                        </div>

                        <div class="form-group mb-3">
                            <label class="form-label">Year of Study</label>
                            <input 
                                type="number"
                                name="yearOfStudy" 
                                class="form-control"
                                value="{{student.yearOfStudy}}"
                                required
                                min="1"
                                max="5"
                                title="Year must be between 1 and 5">
                        </div>

                        <div class="form-group mb-3">
                            <label class="form-label">Skills</label>
                            <input 
                                name="skills"
                                class="form-control"
                                value="{{student.skills}}"
                                required
                                pattern="[A-Za-z,\s]+"
                                title="Enter skills separated by commas">
                        </div>

                        <div class="form-group mb-3">
                            <label class="form-label">Upload / Update Resume</label>
                            <input 
                                type="file" 
                                name="resume" 
                                class="form-control"
                                accept=".pdf,.doc,.docx"
                                title="Upload PDF or Word document">
                        </div>

                        {% if student.resume %}
                        <div class="form-group mb-3">
                            <label class="form-label">Current Resume</label>
                            <br>
                            <a href="/resume/{{student.resume}}" class="btn btn-primary btn-sm" target="_blank">
                                View Resume
                            </a>
                        </div>
                        {% endif %}

                        <button class="btn btn-emerald mt-2">
                            Update Profile
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
