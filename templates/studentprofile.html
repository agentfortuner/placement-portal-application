<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — PlacePortal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="dash-wrap">

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon"><i class="bi bi-lightning-charge-fill"></i></div>
      <div>
        <div class="brand-text">PlacePortal</div>
        <div class="brand-sub">Student Panel</div>
      </div>
    </div>
    <div class="sidebar-nav">
      <span class="sidebar-section-label">Navigation</span>
      <a href="/student" class="sidebar-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="/student/profile" class="sidebar-link active"><i class="bi bi-person-circle"></i> My Profile</a>
      <a href="/student/drives" class="sidebar-link"><i class="bi bi-briefcase"></i> Browse Drives</a>
      <a href="/student/applications" class="sidebar-link"><i class="bi bi-file-earmark-text"></i> My Applications</a>
    </div>
    <div class="sidebar-footer">
      <a href="/logout" class="sidebar-logout"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>
  </nav>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <main class="dash-main">
    <div class="dash-topbar">
      <button class="sidebar-toggle" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
    </div>

    <div class="page-header">
      <div>
        <h1>My Profile</h1>
        <p>Keep your academic details and resume up to date</p>
      </div>
    </div>

    <div class="card anim-fade" style="max-width:640px">
      <div class="card-header">
        <div><h5>Academic Information</h5></div>
        <i class="bi bi-mortarboard text-muted"></i>
      </div>
      <div class="card-body">
        <form method="POST" enctype="multipart/form-data">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Roll Number</label>
              <input class="form-control" name="rollNumber"
                value="{{student.rollNumber}}" required
                pattern="[A-Za-z0-9\-]+"
                title="Roll number should contain letters, numbers or hyphens only">
            </div>
            <div class="form-group">
              <label class="form-label">Department</label>
              <input class="form-control" name="department"
                value="{{student.department}}" required
                pattern="[A-Za-z\s]{2,50}"
                title="Department should contain only letters and spaces">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">GPA</label>
              <input type="number" class="form-control" name="gpa"
                value="{{student.gpa}}" required
                min="0" max="10" step="0.01"
                title="GPA must be between 0 and 10">
            </div>
            <div class="form-group">
              <label class="form-label">Year of Study</label>
              <input type="number" class="form-control" name="yearOfStudy"
                value="{{student.yearOfStudy}}" required
                min="1" max="5"
                title="Year must be between 1 and 5">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Skills <span class="text-muted" style="font-weight:400;font-size:0.75rem">(comma separated)</span></label>
            <input class="form-control" name="skills"
              value="{{student.skills}}" required
              pattern="[A-Za-z,\s]+"
              placeholder="e.g. Python, SQL, Machine Learning"
              title="Enter skills separated by commas">
          </div>

          <div class="form-group">
            <label class="form-label">Upload / Update Resume</label>
            <input type="file" class="form-control" name="resume"
              accept=".pdf,.doc,.docx"
              title="Upload PDF or Word document">
          </div>

          {% if student.resume %}
          <div class="d-flex align-center gap-3 mb-4" style="padding:0.85rem 1rem;background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.2);border-radius:var(--radius-sm)">
            <i class="bi bi-file-earmark-check text-emerald"></i>
            <span style="font-size:0.85rem;flex:1">Resume on file</span>
            <a href="/resume/{{student.resume}}" class="btn btn-teal btn-sm" target="_blank">
              <i class="bi bi-eye"></i> View
            </a>
          </div>
          {% endif %}

          <button type="submit" class="btn btn-emerald w-100">
            <i class="bi bi-check-circle"></i> Update Profile
          </button>
        </form>
      </div>
    </div>
  </main>
</div>
<script>
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebarOverlay').classList.toggle('open');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarOverlay').classList.remove('open');}
</script>
</body>
</html>
