<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — PlacePortal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon-wrap"><i class="bi bi-person-plus-fill"></i></div>
      <h2>Join PlacePortal</h2>
      <p>Choose how you'd like to get started</p>
    </div>

    <div class="register-options">
      <a href="/register-student" class="register-option" style="--feat-color:#818cf8">
        <i class="bi bi-mortarboard-fill" style="color:#818cf8"></i>
        <span>I'm a Student</span>
        <small style="font-size:0.72rem;font-weight:400;color:var(--text-muted);text-align:center">Apply to placement drives</small>
      </a>
      <a href="/register-company" class="register-option" style="--feat-color:#5eead4">
        <i class="bi bi-building-fill" style="color:#5eead4"></i>
        <span>I'm a Company</span>
        <small style="font-size:0.72rem;font-weight:400;color:var(--text-muted);text-align:center">Post drives & hire talent</small>
      </a>
    </div>

    <div class="auth-divider">already registered?</div>
    <a href="/login" class="btn btn-ghost w-100">
      <i class="bi bi-box-arrow-in-right"></i> Sign In Instead
    </a>
  </div>
</div>
</body>
</html>
