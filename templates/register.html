<!DOCTYPE html>
<html>
<head>
    <title>Register | Placement Portal</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center" style="min-height:100vh;">

<div class="container" style="max-width:520px;">
    <div class="card shadow-lg border-0 p-5 text-center">

        <h2 class="fw-bold mb-2">Join Placement Portal</h2>
        <p class="text-muted mb-4">Select how you would like to register</p>

        <div class="d-grid gap-3">

            <a href="/register-student" class="btn btn-primary btn-lg">
                Register as Student
            </a>

            <a href="/register-company" class="btn btn-outline-dark btn-lg">
                Register as Company
            </a>

        </div>

        <hr class="my-4">

        <p class="mb-0">
            Already have an account?
            <a href="/login" class="fw-semibold text-decoration-none">Login</a>
        </p>

    </div>
</div>

</body>
</html>
