<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PlacePortal</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-header text-center mb-4">
                <i class="bi bi-person-plus fs-1 text-primary mb-2"></i>
                <h2>Join PlacePortal</h2>
            </div>
            
            <div class="card-body text-center">
                <a href="/register-student" class="btn btn-primary btn-lg w-100 mb-3">Register as Student</a>
                <a href="/register-company" class="btn btn-ghost btn-lg w-100">Register as Company</a>
            </div>
            
            <hr class="my-4" style="border-color: var(--border-color);">
            
            <div class="text-center">
                <p class="text-muted">Already have an account? <a href="/login" class="text-primary text-decoration-none">Login here</a></p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
